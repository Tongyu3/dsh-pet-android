# ============================================================================
# dsh-pet-android 的 bundle patch —— 把 Android 上层显示衍生插件挂进 DSH 配置树
# ============================================================================
#
# 【与上游的关系】
#   - 本行与上游 dsh-pet 的行**并存**：上游继续负责配置、素材、动画清单、碎碎念/对话等业务能力，
#     本插件只负责「用 Android 系统悬浮窗把同一只宠物显示在应用之上」这一件事。
#   - 因此本文件**不覆盖、不禁用** dsh-pet 那一层；上游的「显示在 dsh 内」分支原样保留。
#   - 不装上游也能装：本插件会连上游路由失败时在页面上明确提示，不会静默显示空白。
#
# 【行标识】
#   id 必须与 src/index.js 的 `export const name` 完全一致（都是 dsh-pet-android），
#   不一致的话插件会静默不生效 —— 这是 Cordis 插件最容易踩的坑。
#
# 【注意】
#   "id: 值" 这一行不能写行尾注释：商城预检用正则抓该行的值并要求其后直接换行。
- insert:
    - id: dsh-pet-android
      name: 'dsh-pet-android'
